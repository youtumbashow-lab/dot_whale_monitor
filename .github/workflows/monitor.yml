name: DOT Whale Monitor (scanner)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          POLKADOT_RPC_URL: ${{ secrets.POLKADOT_RPC_URL }}
        run: python monitor.py

      - name: Commit state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_block.json pending_transfers.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update scanner state"
          git pull --rebase origin main || true
          git push
